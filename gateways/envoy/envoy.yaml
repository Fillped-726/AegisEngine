# ============================================================
# AegisEngine — Envoy Gateway Configuration
# 
# Envoy 替代原有的 Gate Server (TCP 8888) 作为客户端入口
# 客户端通过 Envoy 连接到内部的 Logic Services
# ============================================================

static_resources:
  listeners:
    # ──────────────────────────────────────────────
    # 监听器 1：游戏客户端 TCP 入口（替换原 Gate Server）
    # 客户端原来直连 Gate Server:8888，现在连 Envoy:8888
    # ──────────────────────────────────────────────
    - name: tcp_game_ingress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8888
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: game_tcp
                # 默认路由到 Logic Service
                # 后续可以根据 SNI 或源 IP 做更细粒度的分发
                cluster: logic_service

    # ──────────────────────────────────────────────
    # 监听器 2：管理/监控接口
    # ──────────────────────────────────────────────
    - name: admin_interface
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: admin
                route_config:
                  name: admin_routes
                  virtual_hosts:
                    - name: admin
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: admin_service }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # ──────────────────────────────────────────────
    # 上游集群：Logic Service（游戏逻辑服务）
    # 原来的 Gate Server 会把连接分发到 Logic
    # ──────────────────────────────────────────────
    - name: logic_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      typed_extension_protocol_options:
        # 纯 TCP 透传，不需要协议探测
        envoy.extensions.upstreams.tcp.v3.TcpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.tcp.v3.TcpProtocolOptions
      load_assignment:
        cluster_name: logic_service
        endpoints:
          - lb_endpoints:
              # Logic Service 的地址，可以根据实际情况修改
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10001

    # ──────────────────────────────────────────────
    # 上游集群：第二 Logic Service (示例多服架构)
    # ──────────────────────────────────────────────
    # - name: logic_service_2
    #   type: STRICT_DNS
    #   lb_policy: ROUND_ROBIN
    #   connect_timeout: 5s
    #   typed_extension_protocol_options:
    #     envoy.extensions.upstreams.tcp.v3.TcpProtocolOptions:
    #       "@type": type.googleapis.com/envoy.extensions.upstreams.tcp.v3.TcpProtocolOptions
    #   load_assignment:
    #     cluster_name: logic_service_2
    #     endpoints:
    #       - lb_endpoints:
    #           - endpoint:
    #               address:
    #                 socket_address:
    #                   address: 127.0.0.1
    #                   port_value: 10002

    # ──────────────────────────────────────────────
    # 内部：Admin 服务（Envoy 管理台）
    # ──────────────────────────────────────────────
    - name: admin_service
      type: STATIC
      lb_policy: ROUND_ROBIN
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: admin_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9901

# ──────────────────────────────────────────────
# 管理接口
# ──────────────────────────────────────────────
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9902

# ──────────────────────────────────────────────
# 限流配置（可选）
# 可以通过 Rate Limit Filter 限制客户端连接频率
# ──────────────────────────────────────────────
# layered_runtime:
#   layers:
#     - name: static_rt_layer
#       static_layer:
#         overload:
#           global_downstream_max_connections: 10000

# ──────────────────────────────────────────────
# 健康检查（Envoy 会对上游做主动健康检查）
# Logic Service 需要在对应端口实现健康检查 endpoint
# ──────────────────────────────────────────────
# 对于 TCP 代理，健康检查可以用 TCP 连接检测
# 在 logic_service cluster 中添加 health_checks:
# health_checks:
#   timeout: 1s
#   interval: 10s
#   unhealthy_threshold: 3
#   healthy_threshold: 1
#   tcp_health_check:
#     send: []
#     receive: []
