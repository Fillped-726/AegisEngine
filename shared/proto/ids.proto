syntax = "proto3";
package aegis.ids;

option go_package = "github.com/Fillped-726/AegisEngine/shared/pb/ids";

enum MsgID {
    UNKNOWN = 0;
    
    // 1000-1999: Lobby (Go 处理)
    CS_LOGIN_REQ = 1001;
    SC_LOGIN_RES = 1002;
    
    // 2000-2999: Battle (C++ 处理)
    CS_PING      = 2001; 
    SC_PONG      = 2002;
    CS_MOVE_REQ  = 2003;
    SC_MOVE_NTF  = 2004;
    SC_ENTER_VIEW = 2005;
    SC_LEAVE_VIEW = 2006;

    // --- 3000-3999: Server-Server Bridge (RPC 内部调用) ---
    SS_CREATE_ROOM_REQ    = 3001; // CreateRoomMsg
    SS_TERMINATE_ROOM_REQ = 3002; // TerminateRoomMsg
}