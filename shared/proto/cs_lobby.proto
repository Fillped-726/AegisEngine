syntax = "proto3";
package aegis.cs.lobby;

import "common.proto";

option go_package = "github.com/Fillped-726/AegisEngine/shared/pb/cs_lobby";

// 登录请求
message LoginReq {
    int32 uid = 1;
    string token = 2;
}

message LoginRes {
    int32 ret_code = 1; 
    string msg = 2;
    uint64 entity_id = 3;       
    aegis.common.PBVector3 pos = 4; 
}

// 用于异地登录踢人
message S2C_KickOut {
    string reason = 1;
}

// 营地快照补帧 (重连或初次进营地时下发)
message S2C_CampSnapshotPush {
    uint64 scene_actor_id = 1;
    repeated aegis.common.PBPlayerInfo players = 2; // 包含位置、HP等全量状态
}

// ==========================================================
// 动态营地创建与加入 (Module C)
// ==========================================================

// 玩家请求创建营地
message C2S_CreateCampReq {
    string camp_name = 1;    // 营地名称 (可选，空则使用默认名)
    uint32 map_id = 2;       // 地图ID (预留，不同地图类型)
}

message S2C_CreateCampRes {
    int32 ret_code = 1;
    string msg = 2;
    uint64 scene_actor_id = 3;  // 创建的营地 Scene Actor ID
    string camp_name = 4;
}

// 玩家请求加入营地
message C2S_JoinCampReq {
    uint64 scene_actor_id = 1;  // 要加入的营地 Scene Actor ID
}

message S2C_JoinCampRes {
    int32 ret_code = 1;
    string msg = 2;
    uint64 scene_actor_id = 3;
}

// ==========================================================
// 营地列表查询 (联机大厅)
// ==========================================================

// 玩家查询可用营地列表
message C2S_QueryCampListReq {
    int32 page_index = 1;  // 分页，0=第一页，MVP 阶段填 0
}

// 单个营地信息
message CampInfo {
    uint64 scene_actor_id = 1;
    string camp_name = 2;
    int32 current_players = 3;
    int32 max_players = 4;
}

// 营地列表响应
message S2C_QueryCampListRes {
    repeated CampInfo camps = 1;
    int32 total_count = 2;   // 总营地数（用于前端显示）
}
